spring.application.name=doodlemart-inventory

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=doodlemart_inventory
spring.flyway.default-schema=doodlemart_inventory
spring.flyway.create-schemas=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=doodlemart_inventory

server.port=8082
doodlemart.product-service.base-url=http://localhost:8081
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=doodlemart-inventory
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.doodlemart.inventory.integration.kafka.event.ProductCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.doodlemart.inventory.integration.kafka.event
doodlemart.kafka.topic.product-created=product-created